    <circle cx="37" cy="37" r="3.5" fill="#FAF7EF" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- Brand Typography -->
  <text x="96" y="42" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#082B1D">
