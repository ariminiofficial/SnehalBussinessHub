    <circle cx="37" cy="37" r="30" fill="#123D2A" fill-opacity="0.04"/>
    <!-- Subtle leaves / monogram SBH -->
    <path d="M37 14 C44 24, 46 32, 37 44 C28 32, 30 24, 37 14 Z" fill="#1D6543" opacity="0.85"/>
    <path d="M37 42 C46 48, 52 56, 44 60 C36 56, 38 48, 37 42 Z" fill="url(#goldGrad)" opacity="0.9"/>
