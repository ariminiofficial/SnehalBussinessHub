      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B34"/>
    </linearGradient>
  </defs>
  
  <!-- Emblem Mark: Elegant geometric botanical seal -->
